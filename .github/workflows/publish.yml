name: Publish to npm

# Due modi di pubblicare:
# - push di un tag vX.Y.Z (come prima);
# - avvio manuale (workflow_dispatch) dal ramo main: pubblica la versione di package.json e crea il tag vX.Y.Z.
#   Serve perché il push dei tag da Claude Code è bloccato dai permessi automatici (richiesta di Ivan 28/11/2026).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare, uguale a package.json (es. 0.10.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Check manual run (main, version, tag not yet used)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "${GITHUB_REF_NAME}" = "main"
          test "$(node -p "require('./package.json').version")" = "${VERSION}"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then echo "Il tag v${VERSION} esiste già"; exit 1; fi

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Trusted Publishing (OIDC): nessun token, npm >= 11.5.1 (Node 24 lo include).
      - name: Publish to npm (trusted publishing, with provenance)
        run: npm publish --access public --provenance

      - name: Create tag after manual publish
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"
