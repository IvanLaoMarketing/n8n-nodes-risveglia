name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Trusted Publishing (OIDC): nessun token, npm >= 11.5.1 (Node 24 lo include).
      - name: Publish to npm (trusted publishing, with provenance)
        run: npm publish --access public --provenance
